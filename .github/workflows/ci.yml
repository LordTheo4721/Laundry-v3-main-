name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Diagnose repository root
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "PWD: $(pwd)"
          ls -la
          if [ -f package.json ]; then echo "package.json: PRESENT"; head -5 package.json; else echo "package.json: MISSING"; fi
          echo "Stray package.json files:"; find . -name package.json -not -path '*/node_modules/*'
      - run: npm ci
      - run: npm test
      - name: Test delivery subsystem
        run: cd happy-wash-delivery && npm ci && npm test
      - run: npm run lint
      - run: npm run build