name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Diagnose repository root
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "PWD: $(pwd)"
          ls -la
          if [ -f package.json ]; then echo "package.json: PRESENT"; head -5 package.json; else echo "package.json: MISSING"; fi
          echo "Stray package.json files:"; find . -name package.json -not -path '*/node_modules/*'
      - run: npm ci
      - run: npm test
      - name: Test delivery subsystem
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_DATABASE: laundry_delivery_test
        run: cd happy-wash-delivery && npm ci && npm test
      - run: npm run lint
      - run: npm run build